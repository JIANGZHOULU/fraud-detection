name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  train-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TODO 7d (optional): add ONE extra quality or security step here. 
      - name: Lint code with Ruff
        run: pip install ruff && ruff check .
      # Options:
      #   Lint the code:          run: pip install ruff && ruff check .
      #   Scan code for bugs:     run: pip install bandit && bandit -r app.py train.py
      #   Scan dependencies:      run: pip install pip-audit && pip-audit -r requirements.txt
      # THINK: where in the order should it go? Before training, or at the very end?

      # TODO 7a: run the training script (it also enforces your quality gate).
      - name: Train, track in MLflow and register
        run: python train.py

      # TODO 7b: run the tests.  HINT: the same command you used in Part 4, without the "!"
      - name: Run tests
        run: pytest tests/ -v

      # TODO 7c: build the Docker image and tag it "fraud-api".
      # THINK: why build the image only AFTER the tests pass?
      - name: Build Docker image
        run: docker build -t fraud-api .

      - name: Smoke test the running container
        run: |
          docker run -d -p 8000:8000 --name api fraud-api
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"amount":600.0,"hour":2,"distance_from_home_km":120.0,"merchant_risk":0.8,"txns_last_24h":9,"is_online":1}'
          docker logs api

      - name: Save model and MLflow records
        uses: actions/upload-artifact@v4
        with:
          name: model-and-mlflow
          path: |
            model.joblib
            metrics.json
            mlflow.db
            mlruns/
            mlartifacts/
          if-no-files-found: warn
